<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1800 1050" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura de referencia para Wallet MVP W1 y W2</title>
  <desc id="description">Diagrama de arquitectura local: usuario, frontend, API y monolito modular para onboarding, con adaptador de identidad mock, repositorio SQLite y eventos. W2 aparece como futura etapa.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#45675d"/>
    </marker>
    <marker id="arrowFuture" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L11 6 L1 11 Z" fill="#c45d3c"/>
    </marker>
    <style>
      .text { font-family: 'DM Sans', 'Segoe UI', sans-serif; fill: #172c29; }
      .title { font-family: 'Space Grotesk', 'Segoe UI', sans-serif; font-size: 42px; font-weight: 700; fill: #123b35; }
      .subtitle { font-size: 19px; fill: #65756f; }
      .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 2px; fill: #176b55; }
      .card-title { font-size: 20px; font-weight: 700; }
      .card-copy { font-size: 15px; fill: #52635d; }
      .small { font-size: 13px; fill: #64746d; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .solid { fill: none; stroke: #45675d; stroke-width: 3; marker-end: url(#arrow); }
      .future-line { fill: none; stroke: #c45d3c; stroke-width: 3; stroke-dasharray: 9 8; marker-end: url(#arrowFuture); }
    </style>
  </defs>

  <rect width="1800" height="1050" fill="#f5f7f1"/>
  <rect x="0" y="0" width="1800" height="14" fill="#176b55"/>

  <text class="text eyebrow" x="76" y="70">HACKATHON · WALLET MVP · PERÚ</text>
  <text class="title" x="76" y="126">Arquitectura de referencia</text>
  <text class="text subtitle" x="78" y="162">W1 onboarding como alcance actual · W2 pagos como siguiente etapa</text>

  <rect x="1305" y="68" width="190" height="38" rx="19" fill="#dff2d4"/>
  <circle cx="1326" cy="87" r="6" fill="#176b55"/>
  <text class="text tag" x="1340" y="92" fill="#176b55">W1 · ACTUAL</text>
  <rect x="1510" y="68" width="205" height="38" rx="19" fill="#fff0e9" stroke="#c45d3c" stroke-dasharray="5 4"/>
  <circle cx="1531" cy="87" r="6" fill="#c45d3c"/>
  <text class="text tag" x="1545" y="92" fill="#9e492e">W2 · FUTURO</text>

  <text class="text eyebrow" x="76" y="220">RECORRIDO DE ONBOARDING</text>

  <rect x="76" y="255" width="190" height="150" rx="8" fill="#dff2d4" stroke="#8cae78" stroke-width="2"/>
  <circle cx="112" cy="295" r="18" fill="#176b55"/>
  <circle cx="112" cy="289" r="6" fill="#fff"/>
  <path d="M100 307c2-9 22-9 24 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text class="text card-title" x="101" y="345">Usuario</text>
  <text class="text card-copy" x="101" y="372">Completa el alta</text>

  <rect x="330" y="240" width="290" height="180" rx="8" fill="#ffffff" stroke="#176b55" stroke-width="2"/>
  <rect x="330" y="240" width="290" height="9" rx="5" fill="#176b55"/>
  <text class="text eyebrow" x="355" y="284">FRONTEND · W1</text>
  <text class="text card-title" x="355" y="319">Onboarding guiado</text>
  <text class="text card-copy" x="355" y="350">Datos · progreso · validaciones</text>
  <text class="text card-copy" x="355" y="375">Estado y siguiente paso</text>
  <text class="text small" x="355" y="402">Eventos UI solo en memoria</text>

  <rect x="690" y="255" width="180" height="150" rx="8" fill="#e7eff4" stroke="#5a8292" stroke-width="2"/>
  <text class="text eyebrow" x="716" y="294" fill="#416d7b">API MOCK</text>
  <text class="text card-title" x="716" y="332">Grupo 4</text>
  <text class="text card-copy" x="716" y="360">/groups/4</text>
  <text class="text card-copy" x="716" y="384">REST · CORS</text>

  <rect x="950" y="210" width="590" height="535" rx="12" fill="#edf3ed" stroke="#98b4a3" stroke-width="2"/>
  <rect x="950" y="210" width="590" height="54" rx="12" fill="#123b35"/>
  <rect x="950" y="250" width="590" height="14" fill="#123b35"/>
  <text x="978" y="245" fill="#fff" font-family="'DM Sans', 'Segoe UI', sans-serif" font-size="17" font-weight="700">MOCK COMPARTIDO · W1 · GRUPO 4</text>

  <rect x="982" y="292" width="246" height="130" rx="7" fill="#fff" stroke="#c4d2c7" stroke-width="2"/>
  <text class="text eyebrow" x="1003" y="322">CREAR VERIFICACIÓN</text>
  <text class="text card-title" x="1003" y="353">POST /kyc/</text>
  <text class="text card-title" x="1003" y="378">verifications</text>
  <text class="text small" x="1003" y="403">documentType TEST · TEST-...</text>

  <rect x="1256" y="292" width="252" height="130" rx="7" fill="#fff" stroke="#c4d2c7" stroke-width="2"/>
  <text class="text eyebrow" x="1277" y="322">CONSULTAR ESTADO</text>
  <text class="text card-title" x="1277" y="356">GET verifications/{id}</text>
  <text class="text card-copy" x="1277" y="384">GET /wallets/{wallet_id}</text>
  <text class="text card-copy" x="1277" y="405">KYC ID distinto de wallet_id</text>

  <rect x="982" y="458" width="246" height="125" rx="7" fill="#fff4dc" stroke="#d7b75b" stroke-width="2"/>
  <text class="text eyebrow" x="1003" y="488" fill="#956b0d">DECISIÓN HUMANA</text>
  <text class="text card-title" x="1003" y="521">POST decision</text>
  <text class="text card-copy" x="1003" y="551">/kyc/verifications/{id}</text>
  <text class="text card-copy" x="1003" y="572">ACTIVE · REJECTED</text>

  <rect x="1256" y="458" width="252" height="125" rx="7" fill="#fff" stroke="#c4d2c7" stroke-width="2"/>
  <text class="text eyebrow" x="1277" y="488">CASO PENDIENTE</text>
  <text class="text card-title" x="1277" y="522">GET /support/cases</text>
  <text class="text card-copy" x="1277" y="552">Se consulta en MANUAL_REVIEW</text>

  <rect x="1110" y="617" width="290" height="94" rx="7" fill="#fff" stroke="#c4d2c7" stroke-width="2"/>
  <text class="text eyebrow" x="1132" y="648">ESTADOS KYC</text>
  <text class="text card-title" x="1132" y="680">ACTIVE · PENDING · REJECTED</text>
  <text class="text small" x="1132" y="700">UNAVAILABLE responde 503</text>

  <rect x="1580" y="292" width="180" height="130" rx="8" fill="#fff4dc" stroke="#d7b75b" stroke-width="2"/>
  <text class="text eyebrow" x="1600" y="322" fill="#956b0d">ESCENARIOS KYC</text>
  <text class="text card-title" x="1600" y="357">APPROVED</text>
  <text class="text card-copy" x="1600" y="385">MANUAL_REVIEW</text>
  <text class="text small" x="1600" y="407">REJECTED · UNAVAILABLE</text>

  <rect x="1580" y="458" width="180" height="125" rx="8" fill="#fff" stroke="#9eb1a5" stroke-width="2"/>
  <text class="text eyebrow" x="1600" y="488">PERSISTENCIA DEL MOCK</text>
  <text class="text card-title" x="1600" y="523">SQLite cloud</text>
  <text class="text card-copy" x="1600" y="552">Aislada por grupo</text>

  <rect x="1580" y="617" width="180" height="94" rx="8" fill="#fff" stroke="#9eb1a5" stroke-width="2"/>
  <text class="text eyebrow" x="1600" y="648">ANALÍTICA W1</text>
  <text class="text card-title" x="1600" y="680">Sin endpoint</text>
  <text class="text small" x="1600" y="700">Eventos UI no persistidos</text>

  <path class="solid" d="M266 330 H330"/>
  <path class="solid" d="M620 330 H690"/>
  <path class="solid" d="M870 330 H982"/>
  <path class="solid" d="M1228 357 H1256"/>
  <path class="solid" d="M1105 422 V458"/>
  <path class="solid" d="M1382 422 V458"/>
  <path class="solid" d="M1105 458 V438 H1670 V422"/>
  <path class="solid" d="M1508 520 H1580"/>
  <path class="solid" d="M1200 422 C1220 440 1240 430 1240 452 V617"/>

  <rect x="950" y="800" width="810" height="166" rx="10" fill="#fff8f3" stroke="#c45d3c" stroke-width="2" stroke-dasharray="9 7"/>
  <text class="text eyebrow" x="980" y="837" fill="#a34b31">SIGUIENTE ETAPA · W2</text>
  <rect x="982" y="858" width="300" height="78" rx="6" fill="#fff" stroke="#d99a83" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="text card-title" x="1004" y="890">Servicio de pagos</text>
  <text class="text card-copy" x="1004" y="917">resultado · referencia · historial</text>
  <rect x="1340" y="858" width="360" height="78" rx="6" fill="#fff" stroke="#d99a83" stroke-width="2" stroke-dasharray="6 5"/>
  <text class="text card-title" x="1362" y="890">Proveedor de pagos mock</text>
  <text class="text card-copy" x="1362" y="917">éxito · fallo · expiración</text>
  <path class="future-line" d="M780 405 C780 720 1000 760 1120 858"/>
  <path class="future-line" d="M1282 897 H1340"/>

  <line x1="76" y1="1000" x2="110" y2="1000" stroke="#45675d" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="text small" x="124" y="1005">Flujo W1 implementable ahora</text>
  <line x1="420" y1="1000" x2="454" y2="1000" stroke="#c45d3c" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowFuture)"/>
  <text class="text small" x="468" y="1005">Extensión futura; no forma parte del prototipo W1</text>
  <text class="text small" x="1480" y="1005">Wallet MVP · API mock del laboratorio</text>
</svg>
